<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8" />
  <title>Sound Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; height: 100%; }
    #map { height: 100%; }
    .user-location {
      background: blue;
      border-radius: 50%;
      width: 12px;
      height: 12px;
    }

img {
  max-width: 100%;
  height: auto;
}

  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    function startAudio(audio) {
      console.log("Starting audio:", audio.src);
      audio.play();
    }

    function stopAudio(audio) {
      console.log("Stopping audio:", audio.src);
      audio.pause();
      audio.currentTime = 0; // optional: reset to start
    }

    function toggleAudio(audio) {
      if (audio.paused) {
        console.log("Toggling: play", audio.src);
        audio.play();
      } else {
        console.log("Toggling: pause", audio.src);
        audio.pause();
      }
    }

    function toggleDescription(id, btn) {
      const div = document.getElementById(id);

      if (div.style.display === "none") {
        div.style.display = "block";
        btn.innerText = "Hide Description";
      } else {
        div.style.display = "none";
        btn.innerText = "Show Description";
      }
    }
    // Initialize map centered on Cork
    const map = L.map('map').setView([17.96, 102.61], 12.5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Load sound locations from JSON
    fetch('sounds2.json')
      .then(response => response.json())
      .then(locations => {
        const coordinateCounts = {};
        const OFFSET = 0.00002;
        locations.forEach((loc, index) => {
          //loc.audioObj = new Audio(loc.audio);
          loc.audioObj = new Audio();
          loc.audioObj.preload = "none";
          loc.audioObj.src = loc.audio;
          loc._played = false;
          const coordinateKey = `${loc.lat},${loc.lng}`;
          const duplicateNumber = coordinateCounts[coordinateKey] || 0;
          coordinateCounts[coordinateKey] = duplicateNumber + 1;

          const angle = duplicateNumber * (Math.PI / 3);
          const distance = OFFSET * Math.ceil(duplicateNumber / 6);

          const markerLat = loc.lat + Math.sin(angle) * distance;
          const markerLng = loc.lng + Math.cos(angle) * distance;
          // Store the adjusted coordinates
          loc.markerLat = markerLat;
          loc.markerLng = markerLng;

          // Create the marker at the adjusted position
          const marker = L.marker([markerLat, markerLng]).addTo(map);
          const soundName = loc.audio.split('/').pop();
          //marker.bindTooltip(loc.title, {
          marker.bindTooltip(soundName, {
            direction: "top",
            offset: [0, -10]
          });
          marker.bindPopup(`
            <div style="max-width:300px">

              <h3>${loc.title}</h3>

              <img
                src="${loc.picture}"
              >
              <p><strong>Feeling:</strong> ${loc.feeling}</p>

              <button onclick="toggleDescription('desc-${index}', this)">
                Show Description
              </button>

              <div
                id="desc-${index}"
                style="display:none; margin-top:10px;"
              >
                <p>${loc.description}</p>
              </div>

              <hr>

              <button onclick="startAudio(window.locations[${index}].audioObj)">
                Start
              </button>

              <button onclick="stopAudio(window.locations[${index}].audioObj)">
                Stop
              </button>

              <button onclick="toggleAudio(window.locations[${index}].audioObj)">
                Play / Pause
              </button>

            </div>
          `);
          marker.on('popupclose', function () {
            loc.audioObj.pause();
            loc.audioObj.currentTime = 0;
          });
          // Size the initial map to include every marker
          if (locations.length > 0) {
            const bounds = L.latLngBounds(
              locations.map(loc => [
                loc.markerLat ?? loc.lat,
                loc.markerLng ?? loc.lng
              ])
            );

            map.fitBounds(bounds, {
              padding: [30, 30],
              maxZoom: 16
            });
          }

          // Optional: auto-trigger audio when user enters radiusv
          loc._played = false;
          // Store location globally so popup buttons can access it
          if (!window.locations) window.locations = {};
          window.locations[index] = loc;

          loc.checkDistance = function(userLat, userLng) {
            const dist = getDistance(userLat, userLng, loc.lat, loc.lng);
            if (dist < loc.radius && !loc._played) {
              loc.audioObj.play();
              loc._played = true;
            }
          };
        });

        // Track user location
        navigator.geolocation.watchPosition(pos => {
          const { latitude, longitude } = pos.coords;

          if (!window.userMarker) {
            window.userMarker = L.circleMarker([latitude, longitude], {
              radius: 6,
              color: 'blue'
            }).addTo(map);
          } else {
            window.userMarker.setLatLng([latitude, longitude]);
          }

          // Check geofences
          locations.forEach(loc => loc.checkDistance(latitude, longitude));
        });
      });

    // Play sound manually
    function playSound(path) {
      const audio = new Audio(path);
      audio.play();
    }

    // Haversine distance (meters)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }
  </script>
</body>
</html>
