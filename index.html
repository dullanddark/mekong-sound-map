<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sound Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; height: 100%; }
    #map { height: 100%; }
    .user-location {
      background: blue;
      border-radius: 50%;
      width: 12px;
      height: 12px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // Initialize map centered on Cork
    const map = L.map('map').setView([17.96, 102.61], 12.5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Load sound locations from JSON
    fetch('sounds.json')
      .then(response => response.json())
      .then(locations => {
        locations.forEach(loc => {
          const marker = L.marker([loc.lat, loc.lng]).addTo(map);

          marker.bindPopup(`
            <strong>${loc.title}</strong><br>
            <button onclick="playSound('${loc.audio}')">Play Sound</button>
          `);

          // Optional: auto-trigger audio when user enters radius
          loc._audio = new Audio(loc.audio);
          loc._played = false;

          loc.checkDistance = function(userLat, userLng) {
            const dist = getDistance(userLat, userLng, loc.lat, loc.lng);
            if (dist < loc.radius && !loc._played) {
              loc._audio.play();
              loc._played = true;
            }
          };
        });

        // Track user location
        navigator.geolocation.watchPosition(pos => {
          const { latitude, longitude } = pos.coords;

          if (!window.userMarker) {
            window.userMarker = L.circleMarker([latitude, longitude], {
              radius: 6,
              color: 'blue'
            }).addTo(map);
          } else {
            window.userMarker.setLatLng([latitude, longitude]);
          }

          // Check geofences
          locations.forEach(loc => loc.checkDistance(latitude, longitude));
        });
      });

    // Play sound manually
    function playSound(path) {
      const audio = new Audio(path);
      audio.play();
    }

    // Haversine distance (meters)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }
  </script>
</body>
</html>
